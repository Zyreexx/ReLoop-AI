services:
  # Backend API Service (FastAPI)
  - type: web
    name: reloop-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_FALLBACK
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: reloop-db
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: reloop-db
    region: oregon
    plan: standard
    postgresMajorVersion: "16"
    databaseName: reloop
    user: reloop_admin

